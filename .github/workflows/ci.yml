name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netbox-openbao-ansible-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check \
            'ansible-core>=2.15' 'build==1.3.0' pytest ruff 'twine==6.2.0'

      - name: Lint and unit tests
        run: |
          ruff check .
          python -m pytest tests/unit -q

      - name: Validate Ansible documentation and Galaxy collection
        run: |
          set -euo pipefail
          collections="$(mktemp -d)/collections"
          mkdir -p "$collections/ansible_collections/emersonfelipesp"
          ln -s "$PWD" "$collections/ansible_collections/emersonfelipesp/netbox_openbao"
          ANSIBLE_COLLECTIONS_PATH="$collections" \
            ansible-doc -t lookup emersonfelipesp.netbox_openbao.credential > doc.txt
          grep -q 'no_log' doc.txt
          grep -qi 'rate limit' doc.txt
          ansible-galaxy collection build --output-path galaxy-dist/
          python scripts/release_policy.py verify-galaxy \
            --directory galaxy-dist --version 0.1.0

      - name: Build and inspect Python distributions
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/release_policy.py verify-dist --directory dist --version 0.1.0
          smoke="$(mktemp -d)/venv"
          python -m venv "$smoke"
          "$smoke/bin/python" -m pip install --disable-pip-version-check 'ansible-core>=2.15' dist/*.whl
          collections="$($smoke/bin/python -c 'import site; print(site.getsitepackages()[0])')"
          ANSIBLE_COLLECTIONS_PATH="$collections" \
            "$smoke/bin/ansible-doc" -t lookup emersonfelipesp.netbox_openbao.credential >/dev/null
