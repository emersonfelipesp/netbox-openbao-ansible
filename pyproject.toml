[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Ansible plugins put DOCUMENTATION/EXAMPLES/RETURN above their imports by
# convention; the docs are the interface and belong at the top of the file.
"plugins/lookup/*.py" = ["E402"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
