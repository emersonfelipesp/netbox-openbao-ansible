name: Propose reviewed content to GitHub

on:
  push:
    branches:
      - main

jobs:
  mirror:
    name: Propose content to GitHub
    runs-on: mirror-host
    env:
      GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GITEA_SOURCE_TOKEN: ${{ secrets.SOURCE_MIRROR_TOKEN }}
      GITHUB_OWNER: emersonfelipesp

    steps:
      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          if [ "$(uname -s)" != "Linux" ] || ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::GitHub CLI is not installed and this workflow can only install it on Debian/Ubuntu-style Linux runners."
            exit 1
          fi

          sudo_cmd=()
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::GitHub CLI is missing and sudo is unavailable for installation."
              exit 1
            fi
            sudo_cmd=(sudo -n)
          fi

          "${sudo_cmd[@]}" apt-get update
          "${sudo_cmd[@]}" apt-get install -y ca-certificates curl gnupg
          "${sudo_cmd[@]}" mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | "${sudo_cmd[@]}" tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          "${sudo_cmd[@]}" chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | "${sudo_cmd[@]}" tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          "${sudo_cmd[@]}" apt-get update
          "${sudo_cmd[@]}" apt-get install -y gh
          gh --version

      - name: Propose the triggering content snapshot
        shell: bash
        run: |
          set -euo pipefail
          export GH_HOST=github.com

          validate_source_event() {
            [[ -n "${GH_TOKEN:-}" && -n "${GITEA_SOURCE_TOKEN:-}" ]]
            source_repository="${GITHUB_REPOSITORY:?}"
            source_sha="${GITHUB_SHA:?}"
            [[ "$source_repository" == emersonfelipesp/netbox-openbao-ansible ]]
            [[ "${GITHUB_REF:?}" == refs/heads/main && "${GITHUB_REF_NAME:?}" == main ]]
            [[ "${GITHUB_OWNER:?}" == emersonfelipesp && "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            case "${GITHUB_EVENT_NAME:?}" in
              push) ;;
              *) echo "Unsupported source event." >&2; return 1 ;;
            esac
            target_repo=emersonfelipesp/netbox-openbao-ansible
          }

          require_source_current() {
            local listing
            listing="$(GIT_ASKPASS="$gitea_askpass" GIT_TERMINAL_PROMPT=0 \
              "${publisher_env[@]}" git -C "$worktree" ls-remote --exit-code gitea refs/heads/main)"
            [[ "$listing" == "$source_sha"$'\t'refs/heads/main ]]
          }

          read_public_main() {
            local listing fetched expected_pattern
            listing="$("${publisher_env[@]}" git -C "$worktree" ls-remote --exit-code github refs/heads/main)"
            expected_pattern=$'^[0-9a-f]{40}\trefs/heads/main$'
            [[ "$listing" =~ $expected_pattern ]]
            public_sha="${listing%%$'\t'*}"
            "${publisher_env[@]}" git -C "$worktree" fetch --no-tags github refs/heads/main:refs/remotes/github/main
            fetched="$("${publisher_env[@]}" git -C "$worktree" rev-parse 'refs/remotes/github/main^{commit}')"
            [[ "$fetched" == "$public_sha" ]]
            [[ "$("${publisher_env[@]}" git -C "$worktree" rev-parse --is-shallow-repository)" == false ]]
            [[ "$("${publisher_env[@]}" git -C "$worktree" merge-base "$public_sha" "$source_sha")" =~ ^[0-9a-f]{40}$ ]]
          }

          require_public_current() {
            local listing
            listing="$("${publisher_env[@]}" git -C "$worktree" ls-remote --exit-code github refs/heads/main)"
            [[ "$listing" == "$public_sha"$'\t'refs/heads/main ]]
          }

          inspect_existing_proposal() {
            local information existing_number existing_branch existing_head existing_base existing_actor existing_repository extra commit_info
            information="$("${publisher_env[@]}" gh api "repos/$target_repo/pulls?state=open&base=main&per_page=100" --jq \
              'if length >= 100 then error("Open pull-request inventory is incomplete") else map(select(.head.ref | startswith("ci-publication/"))) | [length, (.[0].number // 0), (.[0].head.ref // "-"), (.[0].head.sha // "-"), (.[0].base.ref // "-"), (.[0].user.login // "-"), (.[0].head.repo.full_name // "-")] | map(tostring) | @tsv end')"
            IFS=$'\t' read -r proposal_count existing_number existing_branch existing_head existing_base existing_actor existing_repository extra <<< "$information"
            [[ "$proposal_count" =~ ^[01]$ && -z "$extra" ]]
            if [[ "$proposal_count" == 0 ]]; then
              return 0
            fi
            [[ "$existing_number" =~ ^[1-9][0-9]*$ && "$existing_base" == main ]]
            [[ "$existing_actor" == "$publication_actor" && "$existing_repository" == "$target_repo" ]]
            [[ "$existing_branch" == "$proposal_branch" && "$existing_head" =~ ^[0-9a-f]{40}$ ]]
            commit_info="$("${publisher_env[@]}" gh api "repos/$target_repo/git/commits/$existing_head" \
              --jq '[.tree.sha, (.parents|length|tostring), .parents[0].sha] | @tsv')"
            [[ "$commit_info" == "$canonical_tree"$'\t'1$'\t'"$public_sha" ]]
            require_source_current
            require_public_current
            echo "The exact content/base proposal already exists; no branch or pull request was changed."
          }

          reserve_proposal_branch() {
            local listing status=0 reserved
            listing="$("${publisher_env[@]}" git -C "$worktree" ls-remote --exit-code github "refs/heads/$proposal_branch")" || status=$?
            [[ "$status" == 2 && -z "$listing" ]]
            require_source_current
            require_public_current
            reserved="$("${publisher_env[@]}" gh api --method POST "repos/$target_repo/git/refs" \
              --raw-field "ref=refs/heads/$proposal_branch" --raw-field "sha=$public_sha" --jq '.object.sha')"
            [[ "$reserved" == "$public_sha" ]]
          }

          publish_proposal() {
            local proposal_sha listing public_body created
            proposal_sha="$(printf 'Propose reviewed repository content\n\nContent tree: %s\n' "$canonical_tree" | \
              "${publisher_env[@]}" git -C "$worktree" -c user.name='Repository publication' \
                -c user.email='repository-publication@users.noreply.github.com' \
                commit-tree "$canonical_tree" -p "$public_sha")"
            [[ "$proposal_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$("${publisher_env[@]}" git -C "$worktree" rev-parse "${proposal_sha}^{tree}")" == "$canonical_tree" ]]
            [[ "$("${publisher_env[@]}" git -C "$worktree" rev-parse "${proposal_sha}^@")" == "$public_sha" ]]
            "${publisher_env[@]}" git -C "$worktree" merge-base --is-ancestor "$public_sha" "$proposal_sha"
            listing="$("${publisher_env[@]}" git -C "$worktree" ls-remote --exit-code github "refs/heads/$proposal_branch")"
            [[ "$listing" == "$public_sha"$'\t'"refs/heads/$proposal_branch" ]]
            require_source_current
            require_public_current
            "${publisher_env[@]}" git -C "$worktree" push github "$proposal_sha:refs/heads/$proposal_branch"
            require_source_current
            require_public_current
            public_body="$(printf 'Propose the complete reviewed repository snapshot for normal pull-request validation.\n\nContent tree: %s\nPublic base: %s\n\nReview the complete visible delta, including removals. No source change is accepted automatically. All applicable native checks and an explicit reviewed squash merge remain required. No release or deployment is requested.\n' "$canonical_tree" "$public_sha")"
            created="$("${publisher_env[@]}" gh api --method POST "repos/$target_repo/pulls" \
              --raw-field title='Propose reviewed repository content' --raw-field "body=$public_body" \
              --raw-field "head=$proposal_branch" --raw-field base=main \
              --jq '[.head.sha, .base.ref, .base.sha] | @tsv')"
            [[ "$created" == "$proposal_sha"$'\t'main$'\t'"$public_sha" ]]
            echo "Created the owned content proposal; public main was not changed."
          }

          validate_source_event
          worktree="$(mktemp -d)"
          trap 'rm -rf "${worktree}"' EXIT
          publisher_home="$worktree/home"
          mkdir -p "$publisher_home/.config/gh"
          publisher_env=(env -u GIT_CONFIG_PARAMETERS HOME="$publisher_home"
            GH_CONFIG_DIR="$publisher_home/.config/gh"
            GIT_CONFIG_GLOBAL="$publisher_home/.gitconfig" GIT_CONFIG_NOSYSTEM=1
            GIT_CONFIG_COUNT=0 GH_HOST=github.com)
          gitea_askpass="$worktree/gitea-askpass.sh"
          cat > "$gitea_askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITEA_SOURCE_TOKEN}" ;;
            *) printf '\n' ;;
          esac
          ASKPASS
          chmod 700 "$gitea_askpass"
          "${publisher_env[@]}" git init "$worktree"
          "${publisher_env[@]}" git -C "$worktree" remote add gitea "https://git.nmulti.cloud/${source_repository}.git"
          GIT_ASKPASS="$gitea_askpass" GIT_TERMINAL_PROMPT=0 \
            "${publisher_env[@]}" git -C "$worktree" fetch --no-tags gitea refs/heads/main
          "${publisher_env[@]}" git -C "$worktree" checkout --detach FETCH_HEAD
          [[ "$("${publisher_env[@]}" git -C "$worktree" rev-parse HEAD)" == "$source_sha" ]]
          canonical_tree="$("${publisher_env[@]}" git -C "$worktree" rev-parse 'HEAD^{tree}')"
          [[ "$canonical_tree" =~ ^[0-9a-f]{40}$ ]]
          "${publisher_env[@]}" gh auth status --hostname github.com
          [[ "$(GH_HOST=github.com "${publisher_env[@]}" gh repo view "$target_repo" --json nameWithOwner --jq '.nameWithOwner')" == "$target_repo" ]]
          [[ "$("${publisher_env[@]}" gh api "repos/$target_repo" --jq '.permissions.push')" == true ]]
          publication_actor="$("${publisher_env[@]}" gh api user --jq '.login')"
          [[ "$publication_actor" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]
          "${publisher_env[@]}" gh auth setup-git --hostname github.com --force
          "${publisher_env[@]}" git -C "$worktree" remote add github "https://github.com/${target_repo}.git"
          read_public_main
          proposal_branch="ci-publication/tree-${canonical_tree:0:16}-base-${public_sha:0:16}"
          inspect_existing_proposal
          if [[ "$proposal_count" == 1 ]]; then
            exit 0
          fi
          if [[ "$("${publisher_env[@]}" git -C "$worktree" rev-parse "${public_sha}^{tree}")" == "$canonical_tree" ]]; then
            echo "Public main already has the exact content tree; no proposal is needed."
            exit 0
          fi
          reserve_proposal_branch
          publish_proposal
